version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: mysql-server

    restart: always

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: employee_db
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django123

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: